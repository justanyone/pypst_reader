[project]
name = "pypst"
version = "0.0.1"
description = "A pure-Python reader for Outlook PST stores — ported from microsoft/outlook-pst-rs (MIT)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Kevin J. Rice" }]
keywords = ["pst", "outlook", "mapi", "email", "forensics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]

# DELIBERATELY EMPTY, and it should stay that way.
#
# The upstream Rust crate's entire runtime dependency set is byteorder,
# thiserror and tracing — which are `struct`, exception classes and `logging`
# in Python. There is nothing here that needs a third-party package, and the
# value of this project is substantially that it installs as a pure wheel with
# nothing underneath it. A dependency added here is a claim that the port
# needs something the original did not; make that claim in an ADR first.
dependencies = []

[project.urls]
Homepage = "https://github.com/justanyone/pypst_reader"
Upstream = "https://github.com/microsoft/outlook-pst-rs"
Specification = "https://learn.microsoft.com/en-us/openspecs/office_file_formats/ms-pst/141923d5-15ab-4ef1-a524-6dce75aae546"

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Pinned EXACTLY, not `>=`, for the same reason SkyKeep pins it: the
    # quality ratchet compares against a recorded integer, and a ruff minor
    # release adds rules. An unpinned upgrade moves the number with nobody
    # changing a line of code — and can move it DOWN, silently granting slack.
    # No [tool.ruff] section anywhere: the baseline is ruff's own defaults, so
    # a bare `ruff check` reproduces exactly the number the ratchet enforces.
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pypst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." so tests can `from tests.conftest import ...`
markers = [
    "oracle: differential test against the built Rust binary; skips when reference/ is absent",
    "private: needs a real mail store under tests/fixtures/private/; skips when absent",
    "slow: a full-file walk rather than a unit check",
]
