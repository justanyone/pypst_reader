[project]
name = "pypstreader"
version = "1.0.0"
description = "A pure-Python, dependency-free reader for Outlook PST stores: walk folders and messages, export mbox and .eml"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }  # MIT, in full, as the file says
authors = [{ name = "Kevin J. Rice" }]
keywords = ["pst", "outlook", "mbox", "eml", "mapi", "email", "forensics", "ediscovery"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# DELIBERATELY EMPTY, and it should stay that way.
#
# The upstream Rust crate's entire runtime dependency set is byteorder,
# thiserror and tracing — which are `struct`, exception classes and `logging`
# in Python. There is nothing here that needs a third-party package, and the
# value of this project is substantially that it installs as a pure wheel with
# nothing underneath it. A dependency added here is a claim that the port
# needs something the original did not; make that claim in an ADR first.
dependencies = []

[project.scripts]
# The one command this package installs. `pypstreader store.pst` writes
# `store.mbox`; everything else it does is an option on that.
pypstreader = "pypstreader.pypstreader:main"

[project.urls]
Homepage = "https://github.com/justanyone/pypstreader"
Repository = "https://github.com/justanyone/pypstreader"
Issues = "https://github.com/justanyone/pypstreader/issues"
Upstream = "https://github.com/microsoft/outlook-pst-rs"
Specification = "https://learn.microsoft.com/en-us/openspecs/office_file_formats/ms-pst/141923d5-15ab-4ef1-a524-6dce75aae546"

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Pinned EXACTLY, not `>=`, for the same reason SkyKeep pins it: the
    # quality ratchet compares against a recorded integer, and a ruff minor
    # release adds rules. An unpinned upgrade moves the number with nobody
    # changing a line of code — and can move it DOWN, silently granting slack.
    # No [tool.ruff] section anywhere: the baseline is ruff's own defaults, so
    # a bare `ruff check` reproduces exactly the number the ratchet enforces.
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pypstreader"]

# The sdist is an EXPLICIT list, not "everything hatchling does not recognise
# as ignored". Two reasons, both learned the hard way. In a git WORKTREE the
# repository's `.git` is a file rather than a directory, so a backend that
# infers its file set from VCS state can fail to infer anything and start
# walking `reference/` — a 1.2 GB pinned clone of the upstream Rust, symlinked
# in, which is the oracle and emphatically not the product. And an sdist is a
# publication: what goes in it should be a decision somebody made, not a
# by-product of what happened to be in the directory. What is here is ONLY
# the installable package, its licence and attribution, and the ADRs that
# record why it is built the way it is — not the fixtures, the oracle, the
# scripts or anything that helps develop it. `include` and `exclude` are both
# set, deliberately redundant, so this stays correct whether or not hatchling
# manages to infer anything from VCS state.
[tool.hatch.build.targets.sdist]
include = [
    "src/pypstreader",
    "docs/adr",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "reference",
    "reference/",
    "tests",
    ".worktrees",
    ".chat_history",
    ".claude",
    "todo",
    "oracle",
    "scripts",
    "alias",
    "uv.lock",
    "*.pst",
]

# hatchling force-includes the nearest .gitignore into every sdist regardless
# of the exclude list above (see hatch_build.py for why); this hook removes
# that one forced entry so the sdist matches the allow-list exactly.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." so tests can `from tests.conftest import ...`
markers = [
    "oracle: differential test against the built Rust binary; skips when reference/ is absent",
    "private: needs a real mail store under tests/fixtures/private/; skips when absent",
    "slow: a full-file walk rather than a unit check",
]
