[grabchat]

# ── Timestamp style ────────────────────────────────────────────────────────
# Controls how each timestamp is rendered inline in the markdown output.
#   A  <sub> tag       small, subscript (original)
#   B  **bold**        pure markdown, works everywhere
#   C  `code span`     monospace + subtle background, pure markdown
#   D  colored text    steel-blue span (requires HTML-capable renderer)
#   E  <mark>          amber highlight chip, no inline CSS needed
#   F  inverted pill   light chip on dark background (VS Code preview)
timestamp_style = F

# ── Export file pruning ────────────────────────────────────────────────────
# Keep only the latest N files matching chat_*_exp_*.md in .chat_history/.
# Older files are moved to /tmp (deleted on next reboot).
# Set to 0 to disable pruning.
keep_latest_exports = 10

# ── Preserved filename ─────────────────────────────────────────────────────
# When true, the output is saved as saved_chatlog_YYYYMMDD_HHMM.md instead
# of the default chat_<session>_exp_<now>.md name.
# saved_chatlog_* files are never touched by the pruning step.
preserve_latest = false

# ── --list default count ───────────────────────────────────────────────────
# Default number of sessions shown by --list when no N is given on the CLI.
list_count = 5
