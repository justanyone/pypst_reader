# pypstreader CI — every push. Fast on purpose: the unit suite must stay under a
# minute so it is run, not skipped.
#
# The differential (oracle) suite is NOT here. It needs a Rust build of
# ~270 MB and a couple of minutes, and it is nightly work: nightly-oracle.yml
# (every check there is a call into scripts/nightly_oracle_local.sh).

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync
      # NOTICE claims this is a port of MIT code at a named revision. This lint
      # is what keeps that claim checkable as the tree grows.
      - name: Provenance lint — every ported module records its upstream
        run: uv run python scripts/check_provenance.py
      # Tier T0: every upstream `#[test]` has exactly one tagged Python twin
      # (docs/TEST-PLAN.md). This job has no `reference/` checkout, so the
      # lint SKIPS here with exit 0 — it bites in the nightly oracle job
      # (nightly-oracle.yml), which checks out the pinned upstream source.
      - name: Upstream parity lint — every upstream test has a twin (skips without reference/)
        run: uv run python scripts/check_upstream_parity.py
      - name: Quality gate — tier-1 rules clean, and the debt did not grow
        run: uv run python scripts/check_quality_ratchet.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync
      # `-m "not oracle"`: the Rust oracle is not built here. `private` tests
      # skip on their own — a CI runner has no mail stores, and must not.
      - name: Unit suite
        run: uv run pytest -q -m "not oracle"

  # A mail store must never reach this repository. .gitignore and the
  # pre-commit hook both guard it locally; this is the guard that cannot be
  # bypassed with --no-verify.
  no-mail-stores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Allowed: Empty.pst (MIT, Microsoft) and the public corpus, every
      # member of which is SHA-256 pinned in MANIFEST.sha256 (ADR-0004).
      - name: No tracked mail store outside the pinned public corpus
        run: |
          set -euo pipefail
          tracked=$(git ls-files '*.pst' '*.ost' '*.pab' \
            | grep -v '^tests/fixtures/Empty.pst$' \
            | grep -v '^tests/fixtures/public/[^/]*\.pst$' || true)
          if [ -n "$tracked" ]; then
            echo "A mail store is tracked by git outside the corpus:"; echo "$tracked"; exit 1
          fi
          echo "clean: only Empty.pst and tests/fixtures/public/"
      - name: Every committed store is the file it claims to be
        run: |
          set -euo pipefail
          echo "13a1f7eb9e35fcac72cf37360e3a96bc  tests/fixtures/Empty.pst" | md5sum -c -
          cd tests/fixtures/public
          sha256sum -c --strict MANIFEST.sha256
          # ...and nothing is present that the manifest does not list
          for f in *.pst; do grep -q "  $f\$" MANIFEST.sha256 || { echo "$f is not in MANIFEST.sha256"; exit 1; }; done
